<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>MORVIX AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            <strong>
                MORVIX AI
            </strong>

        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >

            ＋ Nuevo chat

        </button>


        <div class="history-title">
            CONVERSACIONES
        </div>


        <div
            id="history"
            class="history"
        ></div>


        <div class="sidebar-bottom">


            <button onclick="toggleTheme()">

                🌙 Cambiar tema

            </button>


            <button onclick="showAbout()">

                ⚙️ Configuración

            </button>


            <div class="profile">

                <div class="avatar">
                    M
                </div>

                <div>

                    <strong>
                        Usuario
                    </strong>

                    <small>
                        Plan gratuito
                    </small>

                </div>

            </div>

        </div>

    </aside>



    <!-- =====================================
         CONTENIDO PRINCIPAL
    ====================================== -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">


            <button
                class="menu"
                onclick="toggleSidebar()"
            >
                ☰
            </button>


            <div class="brand-top">

                <strong>
                    MORVIX AI
                </strong>

                <span class="online">
                    ● En línea
                </span>

            </div>


            <button
                class="delete"
                onclick="clearChat()"
                title="Limpiar chat"
            >
                🗑️
            </button>


        </header>



        <!-- =====================================
             CHAT
        ====================================== -->

        <section
            id="chat"
            class="chat"
        >


            <div class="welcome">


                <div class="big-logo">
                    ✦
                </div>


                <h1>
                    ¿En qué puedo ayudarte?
                </h1>


                <p>
                    Pregunta, aprende, crea y descubre
                    con MORVIX AI.
                </p>


                <div class="suggestions">


                    <button
                        onclick="suggest('Explícame qué es la inteligencia artificial')"
                    >

                        🧠
                        Explícame algo

                    </button>


                    <button
                        onclick="suggest('Dame ideas para ganar dinero por internet')"
                    >

                        💰
                        Dame ideas

                    </button>


                    <button
                        onclick="suggest('Ayúdame a crear una página web')"
                    >

                        💻
                        Crear una web

                    </button>


                    <button
                        onclick="suggest('Ayúdame con una tarea escolar')"
                    >

                        📚
                        Ayúdame a estudiar

                    </button>


                </div>


            </div>


        </section>



        <!-- =====================================
             INPUT
        ====================================== -->

        <div class="input-area">


            <div class="input-box">


                <!-- BOTÓN + -->

                <button
                    id="plusButton"
                    class="plus-button"
                    type="button"
                    onclick="toggleTools()"
                    title="Herramientas"
                >

                    ＋

                </button>


                <!-- MENSAJE -->

                <textarea
                    id="message"
                    placeholder="Escribe un mensaje a MORVIX..."
                    rows="1"
                ></textarea>


                <!-- ENVIAR -->

                <button
                    id="send"
                    class="send"
                    onclick="sendMessage()"
                    title="Enviar"
                >

                    ↑

                </button>


            </div>



            <!-- =====================================
                 MENÚ +
            ====================================== -->

            <div
                id="toolsMenu"
                class="tools-menu"
            >


                <button
                    onclick="createImageTool()"
                >

                    <span>
                        🎨
                    </span>

                    <div>

                        <strong>
                            Crear imagen
                        </strong>

                        <small>
                            Genera una imagen con IA
                        </small>

                    </div>

                </button>


                <button
                    onclick="uploadFile()"
                >

                    <span>
                        📎
                    </span>

                    <div>

                        <strong>
                            Subir archivo
                        </strong>

                        <small>
                            Selecciona un archivo
                        </small>

                    </div>

                </button>


                <button
                    onclick="uploadImage()"
                >

                    <span>
                        🖼️
                    </span>

                    <div>

                        <strong>
                            Analizar imagen
                        </strong>

                        <small>
                            Selecciona una imagen
                        </small>

                    </div>

                </button>


                <button
                    onclick="webSearchTool()"
                >

                    <span>
                        🌐
                    </span>

                    <div>

                        <strong>
                            Búsqueda web
                        </strong>

                        <small>
                            Próximamente
                        </small>

                    </div>

                </button>


            </div>



            <!-- INPUT OCULTO PARA ARCHIVOS -->

            <input
                type="file"
                id="fileInput"
                hidden
            >


            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >


            <p class="disclaimer">

                MORVIX AI puede cometer errores.
                Comprueba la información importante.

            </p>


        </div>


    </main>


</div>



<script src="script.js"></script>

</body>

</html>
