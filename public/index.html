<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#ffffff">

    <title>MORVIX AI</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <div class="logo-mark">✦</div>

                <div>
                    <strong>MORVIX</strong>
                    <span>AI</span>
                </div>
            </div>

            <button class="new-chat"
                    onclick="newChat()">
                <span>＋</span>
                Nuevo chat
            </button>

            <div class="history-title">
                CONVERSACIONES
            </div>

            <div id="history"
                 class="history">
            </div>

        </div>

        <div class="sidebar-bottom">

            <button class="side-button"
                    onclick="toggleTheme()">
                <span>◐</span>
                Cambiar apariencia
            </button>

            <button class="side-button"
                    onclick="showStats()">
                <span>▥</span>
                Estadísticas
            </button>

            <button class="side-button"
                    onclick="showAbout()">
                <span>⚙</span>
                Configuración
            </button>

            <div class="profile">

                <div class="avatar">
                    M
                </div>

                <div class="profile-info">
                    <strong>Usuario</strong>
                    <small>Plan gratuito</small>
                </div>

                <span class="profile-more">•••</span>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <button class="mobile-menu"
                    onclick="toggleSidebar()">
                ☰
            </button>

            <div class="top-brand">

                <div class="mini-logo">
                    ✦
                </div>

                <strong>MORVIX AI</strong>

                <span class="online">
                    ● En línea
                </span>

            </div>

            <button class="clear-button"
                    onclick="clearChat()"
                    title="Limpiar conversación">
                ⌫
            </button>

        </header>


        <!-- CHAT -->
        <section id="chat"
                 class="chat">

            <div class="welcome">

                <div class="welcome-logo">
                    <span>✦</span>
                </div>

                <h1>
                    ¿En qué puedo ayudarte?
                </h1>

                <p>
                    Pregunta, crea, aprende y descubre
                    con <strong>MORVIX AI</strong>.
                </p>


                <div class="suggestions">

                    <button onclick="suggest(
                        'Explícame qué es la inteligencia artificial de manera sencilla'
                    )">

                        <div class="suggest-icon blue">
                            ✦
                        </div>

                        <div>
                            <strong>Explícame algo</strong>
                            <small>Aprende un concepto nuevo</small>
                        </div>

                    </button>


                    <button onclick="suggest(
                        'Dame ideas creativas para ganar dinero por internet'
                    )">

                        <div class="suggest-icon green">
                            $
                        </div>

                        <div>
                            <strong>Dame ideas</strong>
                            <small>Encuentra nuevas posibilidades</small>
                        </div>

                    </button>


                    <button onclick="suggest(
                        'Ayúdame a crear una página web moderna'
                    )">

                        <div class="suggest-icon purple">
                            &lt;/&gt;
                        </div>

                        <div>
                            <strong>Crear una web</strong>
                            <small>Programa con MORVIX</small>
                        </div>

                    </button>


                    <button onclick="suggest(
                        'Ayúdame con una tarea escolar'
                    )">

                        <div class="suggest-icon orange">
                            ✎
                        </div>

                        <div>
                            <strong>Ayúdame a estudiar</strong>
                            <small>Aprende paso a paso</small>
                        </div>

                    </button>

                </div>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-wrapper">

                <!-- MENU TOOLS -->

                <div id="toolsMenu"
                     class="tools-menu">

                    <div class="tools-title">
                        Herramientas
                    </div>

                    <button onclick="createImageTool()">

                        <div class="tool-icon image">
                            ✦
                        </div>

                        <div>
                            <strong>Crear imagen</strong>
                            <small>Genera imágenes con IA</small>
                        </div>

                    </button>


                    <button onclick="uploadFile()">

                        <div class="tool-icon file">
                            +
                        </div>

                        <div>
                            <strong>Subir archivo</strong>
                            <small>Selecciona un documento</small>
                        </div>

                    </button>


                    <button onclick="uploadImage()">

                        <div class="tool-icon photo">
                            ◉
                        </div>

                        <div>
                            <strong>Analizar imagen</strong>
                            <small>Comprende una imagen</small>
                        </div>

                    </button>


                    <button onclick="webSearchTool()">

                        <div class="tool-icon web">
                            ◎
                        </div>

                        <div>
                            <strong>Búsqueda web</strong>
                            <small>Información actualizada</small>
                        </div>

                    </button>

                </div>


                <!-- INPUT BOX -->

                <div class="input-box">

                    <button id="plusButton"
                            class="plus-button"
                            onclick="toggleTools()"
                            type="button"
                            title="Herramientas">

                        ＋

                    </button>


                    <textarea
                        id="message"
                        rows="1"
                        placeholder="Escribe un mensaje a MORVIX..."
                    ></textarea>


                    <button id="send"
                            class="send-button"
                            onclick="sendMessage()"
                            type="button">

                        ↑

                    </button>

                </div>


                <input
                    type="file"
                    id="fileInput"
                    hidden
                >

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >


                <div class="input-footer">

                    <span>
                        MORVIX AI puede cometer errores.
                    </span>

                    <span>
                        <b>Enter</b> para enviar
                    </span>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
