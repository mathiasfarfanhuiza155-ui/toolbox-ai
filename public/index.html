<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="MORVIX AI - Tu asistente inteligente">

    <title>MORVIX AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div>

            <div class="brand">

                <div class="brand-logo">
                    ✦
                </div>

                <div>
                    <div class="brand-name">
                        MORVIX
                    </div>

                    <div class="brand-ai">
                        AI
                    </div>
                </div>

            </div>


            <button class="new-chat"
                    onclick="newChat()">

                <span>＋</span>

                <span>
                    Nuevo chat
                </span>

            </button>


            <div class="history-label">
                RECIENTES
            </div>

            <div id="history"
                 class="history">
            </div>

        </div>


        <div class="sidebar-bottom">

            <button onclick="toggleTheme()">
                <span>◐</span>
                Apariencia
            </button>

            <button onclick="showStats()">
                <span>▥</span>
                Estadísticas
            </button>

            <button onclick="showAbout()">
                <span>⚙</span>
                Configuración
            </button>


            <div class="profile">

                <div class="avatar">
                    M
                </div>

                <div class="profile-text">

                    <strong>
                        Usuario
                    </strong>

                    <small>
                        Plan gratuito
                    </small>

                </div>

                <span>
                    ⋯
                </span>

            </div>

        </div>

    </aside>


    <!-- CONTENIDO -->
    <main class="main">

        <!-- HEADER -->

        <header class="topbar">

            <button class="mobile-menu"
                    onclick="toggleSidebar()">
                ☰
            </button>


            <div class="top-title">

                <div class="top-logo">
                    ✦
                </div>

                <strong>
                    MORVIX AI
                </strong>

                <span class="status">
                    <i></i>
                    En línea
                </span>

            </div>


            <button class="top-button"
                    onclick="clearChat()">

                ⌫

            </button>

        </header>


        <!-- CHAT -->

        <section id="chat"
                 class="chat">

            <div class="welcome"
                 id="welcome">

                <div class="hero-logo">

                    <span>
                        ✦
                    </span>

                </div>


                <h1>
                    ¿En qué puedo ayudarte?
                </h1>


                <p>
                    Pregunta, crea, aprende y descubre
                    con <strong>MORVIX AI</strong>.
                </p>


                <div class="cards">


                    <button onclick="suggest(
                        'Explícame la inteligencia artificial de manera sencilla'
                    )">

                        <span class="card-icon">
                            🧠
                        </span>

                        <div>

                            <strong>
                                Explícame algo
                            </strong>

                            <small>
                                Aprende cualquier concepto
                            </small>

                        </div>

                    </button>


                    <button onclick="suggest(
                        'Dame ideas creativas para un proyecto'
                    )">

                        <span class="card-icon">
                            💡
                        </span>

                        <div>

                            <strong>
                                Dame ideas
                            </strong>

                            <small>
                                Crea algo nuevo
                            </small>

                        </div>

                    </button>


                    <button onclick="suggest(
                        'Ayúdame a crear una página web moderna'
                    )">

                        <span class="card-icon">
                            💻
                        </span>

                        <div>

                            <strong>
                                Programar
                            </strong>

                            <small>
                                Crea código y páginas web
                            </small>

                        </div>

                    </button>


                    <button onclick="suggest(
                        'Ayúdame con una tarea escolar'
                    )">

                        <span class="card-icon">
                            📚
                        </span>

                        <div>

                            <strong>
                                Estudiar
                            </strong>

                            <small>
                                Aprende paso a paso
                            </small>

                        </div>

                    </button>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="composer-container">


            <!-- TOOLS -->

            <div id="toolsMenu"
                 class="tools-menu">


                <div class="tools-header">
                    Herramientas MORVIX
                </div>


                <button onclick="createImage()">

                    <span class="tool-image">
                        🎨
                    </span>

                    <div>

                        <strong>
                            Crear imagen
                        </strong>

                        <small>
                            Generar una imagen con IA
                        </small>

                    </div>

                </button>


                <button onclick="chooseFile()">

                    <span class="tool-file">
                        📎
                    </span>

                    <div>

                        <strong>
                            Subir archivo
                        </strong>

                        <small>
                            PDF, TXT, DOCX...
                        </small>

                    </div>

                </button>


                <button onclick="chooseImage()">

                    <span class="tool-photo">
                        🖼️
                    </span>

                    <div>

                        <strong>
                            Analizar imagen
                        </strong>

                        <small>
                            Comprender una imagen
                        </small>

                    </div>

                </button>


                <button onclick="searchWeb()">

                    <span class="tool-web">
                        🌐
                    </span>

                    <div>

                        <strong>
                            Buscar en internet
                        </strong>

                        <small>
                            Información actualizada
                        </small>

                    </div>

                </button>

            </div>


            <div class="composer">

                <button id="plusButton"
                        class="plus"
                        onclick="toggleTools()">

                    ＋

                </button>


                <textarea
                    id="message"
                    rows="1"
                    placeholder="Escribe un mensaje a MORVIX..."
                ></textarea>


                <button id="send"
                        class="send"
                        onclick="sendMessage()">

                    ↑

                </button>

            </div>


            <input
                type="file"
                id="fileInput"
                hidden
            >


            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >


            <div class="composer-info">

                <span>
                    MORVIX AI puede cometer errores.
                </span>

                <span>
                    Enter para enviar · Shift + Enter para nueva línea
                </span>

            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
