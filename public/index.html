<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="MORVIX AI - Tu asistente de inteligencia artificial"
  >

  <title>MORVIX AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">

        <div class="logo-icon">
          ✦
        </div>

        <strong>
          MORVIX AI
        </strong>

      </div>


      <button
        class="new-chat"
        onclick="newChat()"
      >
        ＋ Nuevo chat
      </button>


      <div class="history-title">
        CONVERSACIONES
      </div>


      <div
        id="history"
        class="history"
      ></div>


      <div class="sidebar-bottom">

        <button onclick="toggleTheme()">
          🌙 Cambiar tema
        </button>


        <button onclick="showAbout()">
          ⚙️ Configuración
        </button>


        <div class="profile">

          <div class="avatar">
            M
          </div>

          <div>

            <strong>
              Usuario
            </strong>

            <small>
              Plan gratuito
            </small>

          </div>

        </div>

      </div>

    </aside>



    <!-- MAIN -->

    <main class="main">


      <header class="topbar">

        <button
          class="menu"
          onclick="toggleSidebar()"
        >
          ☰
        </button>


        <div class="brand">

          <strong>
            MORVIX AI
          </strong>

          <span class="online">
            ● En línea
          </span>

        </div>


        <button
          class="delete"
          onclick="clearChat()"
        >
          🗑️
        </button>

      </header>



      <!-- CHAT -->

      <section
        id="chat"
        class="chat"
      >

        <div class="welcome">

          <div class="big-logo">
            ✦
          </div>

          <h1>
            ¿En qué puedo ayudarte?
          </h1>

          <p>
            Pregunta, aprende, crea y descubre
            con MORVIX AI.
          </p>


          <div class="suggestions">

            <button
              onclick="suggest('Explícame qué es la inteligencia artificial')"
            >
              🧠 Explícame algo
            </button>


            <button
              onclick="suggest('Dame ideas creativas para un proyecto')"
            >
              💡 Dame ideas
            </button>


            <button
              onclick="suggest('Ayúdame a crear una página web')"
            >
              💻 Crear una web
            </button>


            <button
              onclick="suggest('Ayúdame con una tarea escolar')"
            >
              📚 Ayúdame a estudiar
            </button>

          </div>

        </div>

      </section>



      <!-- ARCHIVO -->

      <div
        id="file-preview"
        class="file-preview hidden"
      ></div>



      <!-- INPUT -->

      <div class="input-area">


        <div class="tools">

          <button
            class="tool-button"
            onclick="document.getElementById('fileInput').click()"
            title="Subir archivo"
          >
            📎
          </button>


          <input
            id="fileInput"
            type="file"
            hidden
            accept="image/*,.pdf,.txt,.csv,.json"
            onchange="handleFile(this)"
          >


          <button
            class="tool-button"
            id="micButton"
            onclick="toggleMic()"
            title="Hablar"
          >
            🎙️
          </button>


          <button
            class="tool-button"
            onclick="toggleCodeMode()"
            id="codeButton"
            title="Modo programación"
          >
            💻
          </button>

        </div>



        <div class="input-box">

          <textarea
            id="message"
            placeholder="Escribe un mensaje..."
            rows="1"
          ></textarea>


          <button
            id="stop"
            class="stop hidden"
            onclick="stopGeneration()"
          >
            ■
          </button>


          <button
            id="send"
            class="send"
            onclick="sendMessage()"
          >
            ↑
          </button>

        </div>


        <p class="disclaimer">

          MORVIX AI puede cometer errores.
          Comprueba la información importante.

        </p>

      </div>

    </main>

  </div>


  <script src="script.js"></script>

</body>

</html>
