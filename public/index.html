<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">✦</div>
      <strong>ToolBox AI</strong>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ Nuevo chat
    </button>

    <div class="history-title">
      CONVERSACIONES
    </div>

    <div id="history" class="history"></div>

    <div class="sidebar-bottom">

      <button onclick="toggleTheme()">
        ☀️ Cambiar tema
      </button>

      <button onclick="showAbout()">
        ⚙️ Configuración
      </button>

      <div class="profile">

        <div class="avatar">
          M
        </div>

        <div>
          <strong>Usuario</strong>
          <small>Plan gratuito</small>
        </div>

      </div>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <button
        class="menu"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <div>
        <strong>ToolBox AI</strong>

        <span class="online">
          ● En línea
        </span>
      </div>

      <button
        class="delete"
        onclick="clearChat()"
      >
        🗑️
      </button>

    </header>


    <section id="chat" class="chat">

      <div class="welcome">

        <div class="big-logo">
          ✦
        </div>

        <h1>
          ¿En qué puedo ayudarte?
        </h1>

        <p>
          Pregunta, aprende, crea y descubre con ToolBox AI.
        </p>

        <div class="suggestions">

          <button onclick="suggest('Explícame qué es la inteligencia artificial')">
            🧠 Explícame algo
          </button>

          <button onclick="suggest('Dame ideas para ganar dinero por internet')">
            💰 Dame ideas
          </button>

          <button onclick="suggest('Ayúdame a crear una página web')">
            💻 Crear una web
          </button>

          <button onclick="suggest('Ayúdame con una tarea escolar')">
            📚 Ayúdame a estudiar
          </button>

        </div>

      </div>

    </section>


    <div class="input-area">

      <div class="input-box">

        <textarea
          id="message"
          placeholder="Escribe un mensaje..."
          rows="1"
        ></textarea>

        <button
          id="send"
          class="send"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

      <p class="disclaimer">
        ToolBox AI puede cometer errores. Comprueba la información importante.
      </p>

    </div>

  </main>

</div>
